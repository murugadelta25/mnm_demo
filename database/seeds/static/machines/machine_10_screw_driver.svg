<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 72" fill="none">
  <!-- Flat yellow cordless screwdriver (torque tile icon) -->
  <ellipse cx="58" cy="62" rx="28" ry="4" fill="#cbd5e1" opacity="0.45"/>
  <!-- battery pack -->
  <rect x="18" y="44" width="34" height="18" rx="3" fill="#facc15" stroke="#1f2937" stroke-width="2"/>
  <rect x="22" y="51" width="26" height="2.5" rx="1" fill="#1f2937"/>
  <!-- handle -->
  <path d="M28 28h14c2 0 4 2 4 4v14H28c-2 0-4-2-4-4V32c0-2 2-4 4-4z" fill="#374151" stroke="#1f2937" stroke-width="1.5"/>
  <!-- trigger -->
  <rect x="40" y="34" width="6" height="7" rx="1.5" fill="#facc15" stroke="#1f2937" stroke-width="1"/>
  <!-- body -->
  <rect x="14" y="16" width="52" height="16" rx="4" fill="#facc15" stroke="#1f2937" stroke-width="2"/>
  <rect x="18" y="20" width="36" height="8" rx="2" fill="#eab308"/>
  <!-- chuck -->
  <rect x="64" y="19" width="12" height="10" rx="1.5" fill="#374151" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="74" y="21.5" width="8" height="5" rx="1" fill="#4b5563"/>
  <!-- bit tip -->
  <path d="M82 24h8l2 1.5-2 1.5H82z" fill="#1f2937"/>
</svg>
