<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- DIN PMS geometric logo: four tapered diamonds from center -->
  <!-- Top (lime) -->
  <polygon points="32,4 40,22 32,32 24,22" fill="#A8E010"/>
  <!-- Right (cyan) -->
  <polygon points="60,32 42,24 32,32 42,40" fill="#00E5FF"/>
  <!-- Bottom (blue) -->
  <polygon points="32,60 40,42 32,32 24,42" fill="#2979FF"/>
  <!-- Left (teal) -->
  <polygon points="4,32 22,24 32,32 22,40" fill="#00BCD4"/>
</svg>
